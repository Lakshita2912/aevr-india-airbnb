name: Sync Fork

on:
  schedule:
    - cron: '0 * * * *'  # har ghante auto sync
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/shreeram3535/aevr-india-airbnb.git
          git fetch upstream
          git merge upstream/main --allow-unrelated-histories
          git push origin main
